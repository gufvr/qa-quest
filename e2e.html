<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Missão de teste End-to-End do QA Quest na loja fictícia Fikily."
    />
    <title>Teste End-to-End — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <link rel="apple-touch-icon" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/e2e.css" />
  </head>
  <body class="e2e-page">
    <a class="skip-link" href="#e2e-main">Ir para o simulador</a>
    <qa-header variant="simulator"></qa-header>

    <main class="e2e-main" id="e2e-main">
      <div id="e2e-root"></div>
    </main>

    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/e2e.js"></script>
  </body>
</html>
