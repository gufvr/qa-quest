<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Monte e revise um teste em um laboratório didático local de fundamentos da automação."
    />
    <title>Fundamentos da Automação — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/automation-fundamentals.css" />
  </head>
  <body class="automation-page">
    <a class="skip-link" href="#automation-main">Ir para a missão</a>
    <qa-header variant="mission"></qa-header>
    <main id="automation-main" class="automation-main container">
      <qa-support-material
        mission-id="automation-fundamentals"
      ></qa-support-material>
      <div id="automation-fundamentals-root"></div>
    </main>
    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/footer.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/automation-fundamentals.js"></script>
  </body>
</html>
