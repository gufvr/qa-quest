<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Missão de teste exploratório do QA Quest em uma loja fictícia da Fikily."
    />
    <title>Teste Exploratório — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <link rel="apple-touch-icon" href="qaquest.png" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("qa-quest-theme") || "dark";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/exploratory.css" />
  </head>
  <body class="exploratory-page">
    <a class="skip-link" href="#exploratory-main">Ir para o simulador</a>
    <qa-header variant="simulator"></qa-header>

    <main class="exploratory-main" id="exploratory-main">
      <div class="exploratory-container">
        <header class="exploratory-intro">
          <div>
            <span class="label label--cyan"
              >TRILHA 01 · FLUXOS E INVESTIGAÇÃO</span
            >
            <h1>Laboratório Exploratório</h1>
          </div>
          <p>
            Investigue a Fikily como faria em um turno real de QA: crie
            hipóteses, experimente comportamentos e registre evidências.
          </p>
        </header>

        <qa-support-material mission-id="exploratory"></qa-support-material>
        <div id="exploratory-root"></div>
      </div>
    </main>

    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/exploratory.js"></script>
  </body>
</html>
