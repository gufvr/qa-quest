<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Monte um teste Selenium WebDriver em uma simulação local."
    />
    <title>Selenium WebDriver — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/selenium.css" />
  </head>
  <body class="selenium-page">
    <a class="skip-link" href="#sel-main">Ir para a missão</a>
    <qa-header variant="mission"></qa-header>
    <main id="sel-main" class="sel-main container">
      <qa-support-material mission-id="selenium"></qa-support-material>
      <h1 hidden>Da sessão ao parecer.</h1>
      <input id="coupon-code" hidden />
      <div data-testid="coupon-result" hidden></div>
      <span data-testid="coupon-total" hidden></span>
      <div id="selenium-root"></div>
    </main>
    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/footer.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/selenium.js"></script>
  </body>
</html>
