<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Escolha sua trilha de aprendizado em QA após concluir as quatro fases iniciais do QA Quest."
    />
    <title>Trilhas de aprendizado — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <link rel="apple-touch-icon" href="qaquest.png" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("qa-quest-theme") || "dark";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/tracks.css" />
  </head>
  <body class="tracks-page">
    <a class="skip-link" href="#tracks-main">Ir para as trilhas</a>
    <qa-header variant="tracks"></qa-header>

    <main class="tracks-main container" id="tracks-main">
      <div id="tracks-root"></div>
      <section
        class="tracks-foundation-material"
        aria-labelledby="foundation-material-title"
      >
        <span class="label">APOIO DA BASE COMUM · ACESSO LIVRE</span>
        <h2 id="foundation-material-title">Escolha os casos com critério.</h2>
        <p>
          O complemento da Fase 2 ajuda a transformar regras em dados e
          combinações de teste. A leitura é opcional e não depende do progresso.
        </p>
        <qa-support-material mission-id="phase2"></qa-support-material>
      </section>
    </main>

    <qa-footer></qa-footer>

    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/footer.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/tracks.js"></script>
  </body>
</html>
