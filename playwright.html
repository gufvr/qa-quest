<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Monte locators e assertions Playwright em uma simulação local."
    />
    <title>Playwright — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/playwright.css" />
  </head>
  <body class="playwright-page">
    <a class="skip-link" href="#pw-main">Ir para a missão</a>
    <qa-header variant="mission"></qa-header>
    <main id="pw-main" class="pw-main container">
      <qa-support-material mission-id="playwright"></qa-support-material>
      <form hidden aria-hidden="true">
        <label for="pw-category">Categoria</label>
        <select id="pw-category"></select>
        <label for="pw-search">Buscar produto</label>
        <input id="pw-search" />
      </form>
      <qa-stepscript-support framework="playwright"></qa-stepscript-support>
      <p role="status" hidden>Esta simulação não é um trace real.</p>
      <div id="playwright-root"></div>
    </main>
    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/footer.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="components/stepscript-support.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/playwright.js"></script>
  </body>
</html>
