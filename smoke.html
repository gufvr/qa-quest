<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Faça o Smoke Test da Fikily, emita o parecer técnico da release e decida se testes aprofundados podem começar."
    />
    <title>Smoke Test — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <link rel="apple-touch-icon" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/smoke.css" />
  </head>
  <body class="smoke-page">
    <a class="skip-link" href="#smoke-main">Ir para o simulador</a>
    <qa-header variant="simulator"></qa-header>
    <main class="smoke-container" id="smoke-main">
      <div id="smoke-root"></div>
    </main>
    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="pages/smoke.js"></script>
  </body>
</html>
