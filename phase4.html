<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fase 4 do QA Quest: construa um plano de testes para um checkout fictício e responda a mudanças reais de projeto."
    />
    <title>Plano de Testes — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <link rel="apple-touch-icon" href="qaquest.png" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("qa-quest-theme") || "dark";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/phase4.css" />
  </head>
  <body class="planning-page">
    <a class="skip-link" href="#planning">Ir para o planejamento</a>

    <qa-header variant="planner"></qa-header>

    <main id="planning" class="planning-main">
      <div class="planning-container">
        <header class="planning-intro">
          <div>
            <span class="label label--cyan">MUNDO 01 · MISSÃO 04</span>
            <h1>Plano de Testes Guiado</h1>
          </div>
          <p>
            Transforme requisitos, riscos e restrições em uma estratégia de
            teste para o novo checkout da loja fictícia Fikily.
          </p>
        </header>

        <div id="phase4-root"></div>
      </div>
    </main>

    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="pages/phase4.js"></script>
  </body>
</html>
