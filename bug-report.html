<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Transforme um defeito da Fikily em um relato claro, reproduzível e fundamentado por evidências."
    />
    <title>Relato de Defeitos e Evidências — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/bug-report.css" />
  </head>
  <body class="report-page">
    <a class="skip-link" href="#report-main">Ir para a missão</a>
    <qa-header variant="simulator"></qa-header>
    <main class="report-container" id="report-main">
      <qa-support-material mission-id="bug-report"></qa-support-material>
      <div id="bug-report-root"></div>
    </main>
    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/bug-report.js"></script>
  </body>
</html>
