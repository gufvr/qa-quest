<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Valide autenticação, autorização e proteção de dados em uma missão local da Fikily."
    />
    <title>Teste de Segurança — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <link rel="apple-touch-icon" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/security.css" />
  </head>
  <body class="security-page">
    <a class="skip-link" href="#security-main">Ir para a missão</a>
    <qa-header variant="simulator"></qa-header>
    <main class="security-container" id="security-main">
      <qa-support-material mission-id="security"></qa-support-material>
      <div id="security-root"></div>
    </main>
    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/security.js"></script>
  </body>
</html>
