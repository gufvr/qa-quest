<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Construa e revise um teste Cypress em uma simulação didática local."
    />
    <title>Cypress — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/cypress.css" />
  </head>
  <body class="cypress-page">
    <a class="skip-link" href="#cypress-main">Ir para a missão</a>
    <qa-header variant="mission"></qa-header>
    <main id="cypress-main" class="cy-main container">
      <qa-support-material mission-id="cypress"></qa-support-material>
      <h1 hidden>Do cenário ao spec.</h1>
      <div id="cypress-root"></div>
    </main>
    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/footer.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="components/stepscript-support.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/cypress.js"></script>
  </body>
</html>
