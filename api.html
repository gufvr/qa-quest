<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aprenda a validar requisições, respostas e contratos em um laboratório local de API da Fikily."
    />
    <title>Testes de API — QA Quest</title>
    <link rel="icon" type="image/png" href="qaquest.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("qa-quest-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/api.css" />
  </head>
  <body class="api-page">
    <a class="skip-link" href="#api-main">Ir para a missão</a>
    <qa-header variant="simulator"></qa-header>
    <main class="api-container" id="api-main">
      <qa-support-material mission-id="api"></qa-support-material>
      <div id="api-root"></div>
    </main>
    <script type="module" src="components/brand.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/save-status.js"></script>
    <script type="module" src="components/support-material.js"></script>
    <script type="module" src="core/progress.js"></script>
    <script type="module" src="pages/api.js"></script>
  </body>
</html>
